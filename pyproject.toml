[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sbsm-paper"
version = "0.1.0"
description = "Persistent SBSM equity paper-trading engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1",
  "pandas-market-calendars>=5.4,<6",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["sbsm*"]

[tool.setuptools.package-data]
sbsm = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
